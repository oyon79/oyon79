<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>README preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
<style>body{background:#0d1117;margin:0}.markdown-body{box-sizing:border-box;max-width:900px;margin:0 auto;padding:32px}
@media(max-width:600px){.markdown-body{padding:16px}}</style>
<article class="markdown-body" id="c">Loading…</article>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>fetch('../README.md').then(r=>r.text()).then(t=>{const el=document.getElementById('c');el.innerHTML=marked.parse(t);
el.querySelectorAll('img[src^="./"]').forEach(i=>i.src='../'+i.getAttribute('src').slice(2));
el.querySelectorAll('details').forEach(d=>d.open=false)})</script>
